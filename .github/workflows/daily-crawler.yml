# EventNow 수집기 — API 키 없이, 비용 없이
#
#   매일 KST 04:00 (UTC 19:00) 자동 실행 + 사이트의 '최신 정보 가져오기' 버튼으로 즉시 실행
#
#   수집: 대한민국 구석구석 축제 달력 + 문화포털 전시·아동·체험 (+ 매일 실행 때만 팝업 스크래퍼)
#   정제: 규칙 기반 (LLM 없음) → src/data/events.json 병합
#   반영: 변경이 있으면 이 저장소에 커밋 → Vercel이 push를 받아 자동 재배포
#
#   필요한 시크릿 없음 (커밋은 Actions가 자동 제공하는 GITHUB_TOKEN 사용)

name: Daily Crawler

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "수집 소스 (비우면 kfes,culture,seoulportal,mcst,city,public,venue,popup)"
        required: false
        default: ""
        type: string
      quick:
        description: "빠른 실행 (팝업 스크래퍼용 브라우저 설치 생략 — 사이트 버튼이 사용)"
        required: false
        default: "false"
        type: string
      dry_run:
        description: "저장·커밋 건너뛰기"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 동시에 두 번 돌지 않게 (버튼을 여러 사람이 눌러도 하나씩)
concurrency:
  group: daily-crawler
  cancel-in-progress: false

jobs:
  crawl:
    name: Collect → Normalize → Commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python

    env:
      STORE: json
      PARSER: rules
      QUICK: ${{ github.event.inputs.quick == 'true' && 'true' || 'false' }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
      # 좌표 채우기(OpenStreetMap, 초당 1회) 조회 상한 — 버튼 실행은 빠르게
      OSM_MAX_LOOKUPS: ${{ github.event.inputs.quick == 'true' && '40' || '300' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Run crawler pipeline
        run: |
          SOURCES="${{ github.event.inputs.sources }}"
          if [ -z "${SOURCES}" ]; then
            if [ "${QUICK}" = "true" ]; then SOURCES="kfes,culture,seoulportal,mcst,city,public,venue"; else SOURCES="kfes,culture,seoulportal,mcst,city,public,venue,popup"; fi
          fi
          ARGS=(--store json --parser rules --sources "${SOURCES}")
          if [ "${DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python run.py "${ARGS[@]}"

      # 데이터 파일을 저장소에 커밋 → Vercel 자동 재배포
      - name: Commit updated data
        if: ${{ env.DRY_RUN != 'true' }}
        working-directory: .
        run: |
          # 새로 생긴 저장본(처음 실행)도 잡히게 diff 대신 status 로 본다
          DATA="src/data/events.json src/data/events-meta.json python/data/osm_geocode_cache.json python/data/culture_detail_cache.json python/data/seoul_detail_cache.json python/data/osm_reverse_cache.json"
          if [ -z "$(git status --porcelain -- $DATA)" ]; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "eventnow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in $DATA; do [ -f "$f" ] && git add "$f"; done
          git commit -m "data: crawl $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') (${{ github.event_name }})"
          git pull --rebase --autostash
          git push

      - name: Upload staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-staging-${{ github.run_id }}
          path: |
            python/data/raw/
            python/data/parsed/
          if-no-files-found: warn
          retention-days: 7
